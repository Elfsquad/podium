<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1c1660" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile: 824 px on the 1024 grid, the macOS icon size -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <g filter="url(#lift)">
    <!-- The audience screen with a slide on it -->
    <rect x="232" y="228" width="560" height="340" rx="36" fill="#fff"/>
    <rect x="292" y="292" width="232" height="42" rx="21" fill="#5b7cff"/>
    <rect x="292" y="370" width="440" height="24" rx="12" fill="#cfd8ff"/>
    <rect x="292" y="416" width="352" height="24" rx="12" fill="#cfd8ff"/>
    <rect x="292" y="462" width="396" height="24" rx="12" fill="#cfd8ff"/>

    <!-- The lectern -->
    <path d="M404 656 H620 L590 806 H434 Z" fill="#fff" fill-opacity="0.78"/>
    <rect x="350" y="618" width="324" height="54" rx="22" fill="#fff"/>
    <rect x="382" y="796" width="260" height="34" rx="17" fill="#fff"/>
  </g>
</svg>
